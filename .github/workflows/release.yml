name: Release builds

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bt-linux-amd64
            driver: bt-driver-airpods-linux-amd64
          - os: macos-latest
            artifact: bt-macos-arm64
            driver: bt-driver-airpods-macos-arm64
          - os: windows-latest
            artifact: bt-windows-amd64.exe
            driver: bt-driver-airpods-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build
        shell: bash
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.artifact }}" ./cmd/bt
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.driver }}" ./cmd/bt-driver-airpods
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.driver }}

  windows-msi:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Fetch Microsoft-signed profile driver
        shell: pwsh
        env:
          BETTY_MICROSOFT_SIGNED_DRIVER_URL: ${{ secrets.BETTY_MICROSOFT_SIGNED_DRIVER_URL }}
          BETTY_MICROSOFT_SIGNED_DRIVER_TOKEN: ${{ secrets.BETTY_MICROSOFT_SIGNED_DRIVER_TOKEN }}
        run: |
          if (-not $env:BETTY_MICROSOFT_SIGNED_DRIVER_URL) { throw 'Microsoft-signed driver URL is required' }
          $headers = @{}
          if ($env:BETTY_MICROSOFT_SIGNED_DRIVER_TOKEN) { $headers.Authorization = "Bearer $env:BETTY_MICROSOFT_SIGNED_DRIVER_TOKEN" }
          Invoke-WebRequest $env:BETTY_MICROSOFT_SIGNED_DRIVER_URL -Headers $headers -OutFile "$env:RUNNER_TEMP\betty-driver.zip"
          Expand-Archive "$env:RUNNER_TEMP\betty-driver.zip" "$env:RUNNER_TEMP\betty-driver" -Force
          $inf = Get-ChildItem "$env:RUNNER_TEMP\betty-driver" -Filter BettyAAP.inf -Recurse | Select-Object -First 1
          if (-not $inf) { throw 'Downloaded package does not contain BettyAAP.inf' }
          "BETTY_MICROSOFT_SIGNED_DRIVER_DIR=$($inf.DirectoryName)" | Out-File $env:GITHUB_ENV -Append
      - name: Build and sign Windows MSI
        shell: pwsh
        env:
          BETTY_SIGNING_PFX_BASE64: ${{ secrets.BETTY_SIGNING_PFX_BASE64 }}
          BETTY_SIGNING_PFX_PASSWORD: ${{ secrets.BETTY_SIGNING_PFX_PASSWORD }}
        run: ./packaging/windows/build.ps1 -Version "${env:GITHUB_REF_NAME}" -MicrosoftSignedDriverDir $env:BETTY_MICROSOFT_SIGNED_DRIVER_DIR -RequireSigning -RequireMicrosoftDriverSignature
      - name: Smoke-test signed MSI install and clean uninstall
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1 -Msi (Get-ChildItem ./packaging/windows/artifacts/msi -Filter *.msi -Recurse | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: betty-windows-msi
          path: packaging/windows/artifacts/msi/**/*.msi

  publish:
    needs: [build, windows-msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
