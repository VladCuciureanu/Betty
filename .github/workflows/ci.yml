name: CI

# A pull request runs once, on its pull_request event; pushes run only on
# main. Changes to documentation alone skip CI.
on:
  push:
    branches: ['main']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. Runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # macOS minutes cost ten times Linux minutes, so pull requests run the
  # macOS job only when they change code that only macOS compiles; main
  # always runs it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          # macOS is off while Actions spend is capped; re-enable it by
          # deleting these two lines (#130).
          echo "macos=false" >> "$GITHUB_OUTPUT"
          exit 0
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
              grep -Eq 'darwin|_other\.go$|_unix\.go$|\.m$|\.h$|^go\.(mod|sum)$|^\.github/workflows/ci\.yml$'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - os: ${{ needs.changes.outputs.macos != 'true' && 'macos-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build release binary
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/bt${suffix}" ./cmd/bt
          go build -trimpath -ldflags="-s -w" -o "dist/bt-driver-apple-audio${suffix}" ./cmd/bt-driver-apple-audio
          go build -trimpath -ldflags="-s -w" -o "dist/bt-driver-sony${suffix}" ./cmd/bt-driver-sony
          ls -lh "dist/bt${suffix}"
      - name: Build and inspect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./packaging/linux/build-deb.sh 0.0.0 dist-deb
          dpkg-deb --info dist-deb/betty_0.0.0_amd64.deb
          dpkg-deb --info dist-deb/betty-apple-audio_0.0.0_amd64.deb
          dpkg-deb --info dist-deb/betty-sony_0.0.0_amd64.deb
          if dpkg-deb --fsys-tarfile dist-deb/betty_0.0.0_amd64.deb | tar -tf - | grep -Eqi 'airpods|apple.audio|sony'; then
            echo "base package contains vendor-specific files" >&2
            exit 1
          fi
