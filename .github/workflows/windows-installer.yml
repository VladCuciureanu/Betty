name: Windows installer

on:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'cmd/bt-windows-setup/**'
      - 'internal/l2cap/**'
      - 'packaging/windows/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'cmd/bt-windows-setup/**'
      - 'internal/l2cap/**'
      - 'packaging/windows/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      # The WDK's InfVerif task loads InfVerif.dll for the MSBuild process's
      # architecture, and the x64 WDK package ships no x86 build of it, so
      # the default x86 MSBuild cannot verify the driver INF.
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build unsigned validation MSI
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version 0.0.1
      - name: Smoke-test MSI install and clean uninstall
        shell: pwsh
        run: |
          $base = (Get-ChildItem ./packaging/windows/artifacts/msi -Filter betty-windows-x64.msi -Recurse).FullName
          $advanced = (Get-ChildItem ./packaging/windows/artifacts/msi -Filter betty-apple-audio-advanced-windows-x64.msi -Recurse).FullName
          ./packaging/windows/test-installer.ps1 -BaseMsi $base -AdvancedMsi $advanced -SkipDriver
      - uses: actions/upload-artifact@v4
        with:
          name: betty-windows-unsigned-validation
          path: packaging/windows/artifacts/msi/**/*.msi
