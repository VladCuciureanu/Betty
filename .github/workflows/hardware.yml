name: Hardware tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware:
    strategy:
      fail-fast: false
      matrix:
        os: [self-hosted-linux-bluetooth, self-hosted-macos-bluetooth, self-hosted-windows-bluetooth]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test -tags=hardware ./...
